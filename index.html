<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>גיא ברקן</title>
  <meta name="description" content="גיא ברקן - דיאטן קליני ומאסטר NLP">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="hero">
      <div class="shell brandline brandline-logo-only">
        <img src="assets/animo-logo.jpeg" alt="ANIMO">
      </div>

      <div class="shell hero-grid">
        <div>
          <div class="eyebrow"><span id="name"></span> · <span id="profession"></span></div>
          <h1 id="heroHeadline"></h1>
          <div class="hero-copy" id="heroText"></div>
          <div class="cta-row">
            <a id="heroWhatsapp" class="social-circle whatsapp-circle" target="_blank" rel="noopener" aria-label="WhatsApp">
              <svg viewBox="0 0 32 32" aria-hidden="true">

                <path d="M16.03 3.2c-6.99 0-12.67 5.68-12.67 12.67 0 2.23.58 4.41 1.68 6.33L3.25 28.8l6.76-1.77a12.6 12.6 0 0 0 6.02 1.53h.01c6.99 0 12.67-5.68 12.67-12.67S23.02 3.2 16.03 3.2Zm0 23.22h-.01a10.5 10.5 0 0 1-5.35-1.46l-.38-.23-4.01 1.05 1.07-3.91-.25-.4a10.5 10.5 0 1 1 8.93 4.95Z"/>
              </svg>
            </a>
            <a id="heroCalendly" class="pill acid" target="_blank" rel="noopener">קביעת פגישה</a>
          </div>
        </div>

        <div class="hero-photo">
          <img id="heroImage" alt="גיא ברקן">
        </div>
      </div>
    </section>

    <section class="band">
      <div class="shell band-grid">
        <h2 id="aboutTitle"></h2>
        <div class="band-copy" id="aboutText"></div>
      </div>
    </section>

    <section class="section">
      <div class="shell">
        <div class="section-head">
          <div class="section-kicker">01 / מי אני</div>
          <h2>שתי דקות.<br>בלי פילטרים.</h2>
        </div>
        <div class="video-grid" id="videos"></div>
      </div>
    </section>

    <section class="section">
      <div class="shell">
        <div class="section-head">
          <div class="section-kicker">02 / אנשים מספרים</div>
          <h2>לא צריך<br>לקחת את המילה שלי.</h2>
        </div>
        <div class="reviews-strip" id="reviews"></div>
      </div>
    </section>

    <section class="workshop">
      <div class="shell workshop-card">
        <h2 id="workshopTitle"></h2>
        <div class="workshop-side">
          <p id="workshopText"></p>
          <a id="workshopUrl" class="pill black" target="_blank" rel="noopener">להרשמה לסדנה</a>
        </div>
      </div>
    </section>

    <section class="contact">
      <div class="shell">
        <h2>נדבר?</h2>
        <p>פגישה, שאלה או פשוט להבין אם זה מתאים. בחרו את הדרך שנוחה לכם.</p>
        <div class="cta-row">
          <a id="contactWhatsapp" class="social-circle whatsapp-circle" target="_blank" rel="noopener" aria-label="WhatsApp">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M19.11 17.59c-.26-.13-1.55-.76-1.79-.85-.24-.09-.41-.13-.59.13-.17.26-.67.85-.82 1.02-.15.17-.3.19-.56.06-.26-.13-1.09-.4-2.08-1.29-.77-.69-1.29-1.54-1.44-1.8-.15-.26-.02-.4.11-.53.12-.12.26-.3.39-.45.13-.15.17-.26.26-.43.09-.17.04-.32-.02-.45-.06-.13-.59-1.42-.8-1.94-.21-.51-.43-.44-.59-.45h-.5c-.17 0-.45.06-.69.32-.24.26-.91.89-.91 2.17s.93 2.52 1.06 2.69c.13.17 1.83 2.79 4.43 3.91.62.27 1.1.43 1.48.55.62.2 1.18.17 1.63.1.5-.08 1.55-.63 1.77-1.24.22-.61.22-1.13.15-1.24-.06-.11-.24-.17-.5-.3Z"/>
              <path d="M16.03 3.2c-6.99 0-12.67 5.68-12.67 12.67 0 2.23.58 4.41 1.68 6.33L3.25 28.8l6.76-1.77a12.6 12.6 0 0 0 6.02 1.53h.01c6.99 0 12.67-5.68 12.67-12.67S23.02 3.2 16.03 3.2Zm0 23.22h-.01a10.5 10.5 0 0 1-5.35-1.46l-.38-.23-4.01 1.05 1.07-3.91-.25-.4a10.5 10.5 0 1 1 8.93 4.95Z"/>
            </svg>
          </a>
          <a id="contactFacebook" class="social-circle facebook-circle" target="_blank" rel="noopener" aria-label="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13.7 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5H17V3.9c-.3 0-1.4-.1-2.6-.1-2.6 0-4.4 1.6-4.4 4.5V10H7v3h3v8h3.7Z"/>
            </svg>
          </a>
          <a id="contactCalendly" class="pill contact-calendly" target="_blank" rel="noopener">קביעת פגישה</a>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="shell" id="footerText"></div>
    </footer>
  </main>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
